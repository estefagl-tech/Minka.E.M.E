<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <link rel="stylesheet" href="..//CSS/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <title>Iniciar sesión</title>
</head>

<body>

    <section class="section fondo">
        <div class="container">
            <div class="columns is-vcentered">


                <div class="column is-half">
                    <div class="box registro">
                        <h1 class="title has-text-centered">Iniciar sesión
                            
                        </h1>
                        <h1 class="subtitle has-text-centered">Ingresa tus datos</h1>




                        <div class="field">
                            <p class="control has-icons-left">
                                <input class="input" type="text" placeholder="Nombre de usuario">
                                <span class="icon is-small is-left">
                                    <i class="fas fa-user"></i>
                                </span>
                            </p>
                        </div>
                        <br>
                        </br>



                        <div class="field">
                            <p class="control has-icons-left">
                                <input class="input" type="password" placeholder="Contraseña">
                                <span class="icon is-small is-left">
                                    <i class="fas fa-lock"></i>
                                </span>
                            </p>
                        </div>
                        <br>
                        </br>







                        <div class="field">
                            <button class="button boton-registro">Acceder ahora</button>
                        </div>

                        <p class="subtitle has-text-centered">Ingresa con otros</h1>
                            <br>
                            </br>

                            <button class="button is-light is-fullwidth">
                                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQo51RaSL38xlksvpHe9OoUJhg5oB5vlyKqJm5fjqdgkA&s=10"
                                    alt="Google" style="height:20px; margin-right:8px;">
                                Con Google
                            </button>
                            <BR>

                            <button class="button is-light is-fullwidth">
                                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQUvvWX2Fnj0jcFHOlzfFFP0V2c7EaV7ko0G6vlAAkWEg&s=10"
                                    alt="Google" style="height:20px; margin-right:8px;">
                                Con Facebook
                            </button>
                            </BR>

                            <button class="button is-light is-fullwidth">
                                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRQGmEjXZmsB-2HC5di5yBrBEs5LVzcG4KaBs97EndWaA&s"
                                    alt="Google" style="height:20px; margin-right:8px;">
                                Con Apple
                            </button>
                            <br>
                            </br>



                        <div class="logo">
                            <div class="logo-circulo">M</div>
                            <span>MINKA</span>
                        </div>

                    </div>
                </div>







                <div class="column registro">


                    <div class="column imagen">
                        <figure class="image is-fullheight">
                            <img src="https://i.pinimg.com/236x/1b/24/25/1b2425774e81147714ae5e6d46d7bbee.jpg"
                                alt="Imagen">
                        </figure>
                    </div>
                </div>





            </div>

        </div>
        </div>
    </section>

    <script src="../JS/login.js"></script>

</body>

</html>
