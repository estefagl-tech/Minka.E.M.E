<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centro Educativo - Iniciar sesión</title>
  <link rel="stylesheet" href="../CSS/login.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
  <section class="fondo">
    <div class="formulario">
      <h1 class="titulo">Iniciar sesión</h1>
      <p class="subtitulo">Ingresa tus datos</p>

      <label for="usuario">Nombre de usuario</label>
      <div class="input-con-icono">
        <i class="fas fa-user"></i>
        <input type="text" id="usuario" placeholder="Ingresa tu usuario">
      </div>

      <label for="password">Contraseña</label>
      <div class="input-con-icono">
        <i class="fas fa-lock"></i>
        <input type="password" id="password" placeholder="Ingresa tu contraseña">
      </div>

      <button class="btn-primario" id="loginBtn">Acceder ahora</button>
      <button class="btn-secundario" onclick="window.location.href='../HTML/registrarse.html'">Registrarse</button>

      <div class="logo">
        <div class="logo-circulo">M</div>
        <span>MINKA</span>
      </div>
    </div>
  </section>
  <script src="../JS/login.js"></script>
</body>

</html>
