<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>CUAL ES TU PROYECTO?</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma/css/bulma.min.css">
  <link rel="stylesheet" href="../CSS/mi_proyecto.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
  <section class="section">
    <div class="container box">
      <h1 class="title has-text-centered">CUAL ES TU PROYECTO?</h1>
      <div class="logo">
        <div class="logo-circulo"><em>M</em></div>
        <span>MINKA</span>
      </div>
      <form id="proyectoForm">
        <h3 class="title is-5">Datos del solicitante</h3>
        <div class="form-row">
          <div class="field">
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" name="nombre" placeholder="Nombre completo">
          </div>
          <div class="field">
            <label for="documento">Documento de identidad</label>
            <input type="text" id="documento" name="documento" placeholder="Documento de identidad">
          </div>
        </div>
        <div class="form-row">
          <div class="field">
            <label for="telefono">Teléfono de contacto</label>
            <input type="tel" id="telefono" name="telefono" placeholder="Número de contacto">
          </div>
          <div class="field">
            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" name="correo" placeholder="Correo electrónico">
          </div>
        </div>
        <div class="form-row full-width">
          <div class="field">
            <label for="direccion">Dirección (opcional)</label>
            <input type="text" id="direccion" name="direccion" placeholder="Dirección">
          </div>
        </div>
        <h3 class="title is-5">Información de la causa</h3>
        <div class="field">
          <label for="titulo">Título de la causa</label>
          <input type="text" id="titulo" name="titulo" placeholder="Título de la causa">
        </div>
        <div class="field">
          <label for="descripcion">Describe la situación y la ayuda que se necesita</label>
          <textarea id="descripcion" name="descripcion" placeholder="Descripción detallada"></textarea>
        </div>
        <div class="field">
          <label for="objetivo">Objetivo de la causa</label>
          <input type="text" id="objetivo" name="objetivo" placeholder="Objetivo principal">
        </div>
        <div class="field">
          <label for="tipo">Tipo de ayuda</label>
          <input type="text" id="tipo" name="tipo" placeholder="Ejemplo: económica, voluntariado...">
        </div>
        <div class="field">
          <label for="fecha">Fecha límite</label>
          <input type="date" id="fecha" name="fecha">
        </div>
        <h3 class="title is-5">Evidencia y soporte</h3>
        <div class="field">
          <label for="archivo">Subir fotos o documentos</label>
          <input type="file" id="archivo" multiple>
        </div>
        <div class="field">
          <label for="url">Enlaces a redes sociales / sitio web</label>
          <input type="url" id="url" name="url" placeholder="https://">
        </div>
        <h3 class="title is-5">Opciones de participación</h3>
        <div class="requisitos">
          <label><input type="checkbox"> Permitir donaciones</label>
          <label><input type="checkbox"> Permitir que compartan la causa</label>
          <label><input type="checkbox"> Permitir contacto directo</label>
        </div>
        <hr class="separador">
        <div class="form-row full-width">
          <label>
            <input type="checkbox" name="acepto">
            Acepto que la información proporcionada será utilizada para evaluar mi solicitud
          </label>
        </div>
        <div class="field has-text-centered">
          <button class="button is-success is-medium">Enviar datos</button>
          <a href="../home/home.html" class="button-volver">Volver</a>
        </div>
      </form>
    </div>
  </section>
  <script src="../JS/mi_proyecto.js"></script>
</body>
</html>
