<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro</title>
  <link rel="stylesheet" href="../CSS/registrarse.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
  <section class="fondo">
    <div class="formulario">
      <h1 class="titulo">Registrarse</h1>
      <p class="subtitulo">Completa tus datos personales</p>

      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" placeholder="Nombre">

      <label for="apellidos">Apellidos</label>
      <input type="text" id="apellidos" placeholder="Apellidos">

      <label for="tipoDocumento">Tipo de documento</label>
      <select id="tipoDocumento">
        <option>Cédula de ciudadanía</option>
        <option>Tarjeta de identidad</option>
        <option>Cédula de extranjería</option>
        <option>Pasaporte</option>
      </select>

      <label for="numeroDocumento">Número de documento</label>
      <input type="number" id="numeroDocumento" placeholder="Número de documento">

      <label for="departamento">Departamento</label>
      <input type="text" id="departamento" placeholder="Departamento">

      <label for="municipio">Municipio</label>
      <input type="text" id="municipio" placeholder="Municipio">

      <label for="telefono">Teléfono</label>
      <input type="tel" id="telefono" placeholder="Teléfono">

      <label for="correo">Correo electrónico</label>
      <input type="email" id="correo" placeholder="tunombre@gmail.com">

      <label for="contraseña">Contraseña</label>
      <input type="password" id="contraseña" placeholder="Contraseña">

      <button class="btn-primario" id="continuarBtn">Continuar</button>
      <button class="btn-secundario" onclick="window.location.href='../HTML/login.html'">Iniciar sesion</button>

      <div class="logo">
        <div class="logo-circulo">M</div>
        <span>MINKA</span>
      </div>
    </div>
  </section>
  <script src="../JS/registrarse.js"></script>
</body>
</html>
