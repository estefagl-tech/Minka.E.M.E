<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <link rel="stylesheet" href="..//CSS/Registrarse.css">
    <title>Registro</title>
</head>

<body>

    <div class="fondo">

        <div class="registro">

            <h1 class="title has-text-centered">REGISTRARSE</h1>


            <div class="columns">

                <div class="column">
                    <div class="field">
                        <label class="label">Nombre</label>
                        <div class="control">
                            <input class="input" type="text" placeholder="Nombre">
                        </div>
                    </div>
                </div>

                <div class="column">
                    <div class="field">
                        <label class="label">Apellidos</label>
                        <div class="control">
                            <input class="input" type="email" placeholder="Apellidos">
                        </div>
                    </div>
                </div>

            </div>



            <div class="columns">

                <div class="column">
                    <label class="label">Tipo de documento</label>
                    <div class="control">
                        <div class="select" aria-placeholder="Tipo de documento">
                            <select>
                                <option>Cédula de ciudadanía</option>
                                <option>Tarjeta de identidad</option>
                                <option>Cédula de extranjería</option>
                                <option>Pasaporte</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="column">
                    <div class="field">
                        <label class="label">Número de documento</label>
                        <div class="control">
                            <input class="input" type="number" placeholder="Numero de documento">
                        </div>
                    </div>
                </div>

            </div>



            <div class="columns">

                <div class="column">
                    <div class="field">
                        <label class="label">Departamento</label>
                        <div class="control">
                            <input class="input" type="text" placeholder="Departamento">
                        </div>
                    </div>
                </div>

                <div class="column">
                    <div class="field">
                        <label class="label">Municipio</label>
                        <div class="control">
                            <input class="input" type="text" placeholder="Municipio">
                        </div>
                    </div>
                </div>

            </div>



            <div class="columns">

                <div class="column">
                    <div class="field">
                        <label class="label">Dirección</label>
                        <div class="control">
                            <input class="input" type="text" placeholder="Direción">
                        </div>
                    </div>
                </div>

                <div class="column">
                    <div class="field">
                        <label class="label">Telefono</label>
                        <div class="control">
                            <input class="input" type="tel" placeholder="Telefono">
                        </div>
                    </div>
                </div>

            </div>



            <div class="columns">

                <div class="column">
                    <div class="field">
                        <label class="label">Correo electrónico</label>
                        <div class="control">
                            <input class="input" type="email" placeholder="tunombre@gmail.com">
                        </div>
                    </div>
                </div>

                <div class="column">
                    <div class="field">
                        <label class="label">Contraseña</label>
                        <div class="control">
                            <input class="input" type="password" placeholder="Contraseña">
                        </div>
                    </div>
                </div>

            </div>



            <button class="button boton-registro">
                Continuar
            </button>


            <div class="logo">
                <div class="logo-circulo">M</div>
                <span>MINKA</span>
            </div>



            <div class="estrella" style="top:20px; left:30px;"></div>
            <div class="estrella" style="top:100px; left:200px;"></div>


        </div>

    </div>

    <script src="../JS/registrarse.js"></script>

</body>

</html>
