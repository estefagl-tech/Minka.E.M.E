<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Ofrecer Mascota</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma/css/bulma.min.css">
  <link rel="stylesheet" href="../CSS/Mascota_para_adoptar.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
  <section class="section">
    <div class="container box">
      <h1 class="title has-text-centered">VOY A OFRECER UNA MASCOTA</h1>

      <div class="logo">
        <div class="logo-circulo"><em>M</em></div>
        <span>MINKA</span>
      </div>

      <form id="mascotaForm">
        <h3 class="title is-5">Datos de la mascota</h3>
        <div class="form-row">
          <div class="field">
            <label for="nombreMascota">Nombre de la mascota</label>
            <input type="text" id="nombreMascota" placeholder="Ej. Luna, Rocco...">
          </div>
          <div class="field">
            <label for="edadMascota">Edad</label>
            <input type="text" id="edadMascota" placeholder="Ej. 2 años">
          </div>
        </div>

        <div class="form-row">
          <div class="field">
            <label for="especie">Especie</label>
            <input type="text" id="especie" placeholder="Ej. Gato, Perro">
          </div>
          <div class="field">
            <label for="sexo">Sexo</label>
            <select id="sexo" class="input">
              <option>Hembra</option>
              <option>Macho</option>
            </select>
          </div>
        </div>

        <div class="form-row full-width">
          <div class="field">
            <label for="descripcion">Descripción</label>
            <textarea id="descripcion" rows="3" placeholder="Ej. Juguetón, cariñoso, independiente..."></textarea>
          </div>
        </div>

        <h3 class="title is-5">Foto de la mascota</h3>
        <div class="upload-box">
          <span>Sube una foto de la mascota</span>
          <input type="file" id="fotoMascota" accept="image/*" class="upload-btn">
        </div>

        <h3 class="title is-5">Información adicional</h3>
        <div class="form-row full-width">
          <div class="field">
            <label for="informacion">Detalles adicionales</label>
            <textarea id="informacion" rows="3"
              placeholder="Ej. Vacunas al día, esterilizado, comportamiento especial..."></textarea>
          </div>
        </div>

        <hr class="separador">

        <div class="form-row full-width">
          <label>
            <input type="checkbox" id="acepto"> Acepto que la información será utilizada solo para coordinar la adopción
          </label>
        </div>

        <div class="field has-text-centered">
          <button class="button is-success is-medium" id="enviarBtn">Enviar</button>
          <a href="../home/home.html" class="button-volver" id="volverBtn">Volver</a>
        </div>
      </form>
    </div>
  </section>
  <script src="../JS/mascota_para_adoptar.js"></script>
</body>

</html>
