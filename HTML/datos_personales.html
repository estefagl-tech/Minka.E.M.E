<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
  <link rel="stylesheet" href="..//CSS/datos_personales.css">

  <title>Datos Personales</title>
</head>

<body>

  <div class="fondo">
    <div class="perfil-box">

      <div class="logo">
        <div class="logo-circulo"><em>M</em></div>
        <span>MINKA</span>
      </div>

      <h1 class="title has-text-centered">DATOS PERSONALES</h1>


      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre" placeholder="Nombre">

      <label for="correo">Correo</label>
      <input type="email" id="correo" name="correo" placeholder="tunombre@gmail.com">

      <div class="botones">
        <button class="btn">Cambiar Contraseña</button>
        <button class="btn">Cerrar Sesión</button>
      </div>

      <button class="btn volver">Volver</button>
    </div>
  </div>

  <script src="../JS/datos_personales.js"></script>

</body>

</html>
