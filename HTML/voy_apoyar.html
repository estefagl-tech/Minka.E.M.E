<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Voy a Apoyar</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma/css/bulma.min.css">
  <link rel="stylesheet" href="../CSS/voy_apoyar.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
  <section class="section">
    <div class="container box">
      <h1 class="title has-text-centered">VOY A APOYAR</h1>
      <form action="" method="post" id="apoyoForm">
        <h3 class="title is-5">Datos del colaborador</h3>
        <div class="form-row">
          <div class="field">
            <label for="nombre">Nombre completo <span class="obligatorio">*</span></label>
            <input type="text" id="nombre" name="nombre" placeholder="Nombre completo" required>
          </div>
          <div class="field">
            <label for="documento">Documento de identidad <span class="obligatorio">*</span></label>
            <input type="text" id="documento" name="documento" placeholder="Documento de identidad" required>
          </div>
        </div>

        <div class="form-row">
          <div class="field">
            <label for="telefono">Teléfono de contacto <span class="obligatorio">*</span></label>
            <input type="tel" id="telefono" name="telefono" placeholder="Número de contacto" required>
          </div>
          <div class="field">
            <label for="correo">Correo electrónico <span class="obligatorio">*</span></label>
            <input type="email" id="correo" name="correo" placeholder="Correo electrónico" required>
          </div>
        </div>

        <div class="form-row full-width">
          <div class="field">
            <label for="direccion">Dirección </label>
            <input type="text" id="direccion" name="direccion" placeholder="Dirección">
          </div>
        </div>

        <h3 class="title is-5">Tipo de apoyo</h3>
        <div class="form-row">
          <div class="field">
            <label for="apoyo">Seleccione tipo de apoyo <span class="obligatorio">*</span></label>
            <select id="apoyo" name="apoyo" class="input" required>
              <option value="">Seleccione...</option>
              <option value="donacion">Donación económica</option>
              <option value="especie">Apoyo en especie</option>
              <option value="voluntariado">Voluntariado</option>
              <option value="otro">Otro</option>
            </select>

          </div>
          <div class="field">
            <label for="monto">Monto o disponibilidad</label>
            <input type="text" id="monto" name="monto" placeholder="Cantidad o disponibilidad">
          </div>
        </div>

        <div class="form-row full-width">
          <div class="field">
            <label for="fecha">Fecha estimada de apoyo</label>
            <input type="date" id="fecha" name="fecha">
          </div>
        </div>

        <h3 class="title is-5">Detalles de contacto</h3>
        <div class="form-row">
          <div class="field">
            <label for="metodo">Método de entrega/transferencia <span class="obligatorio">*</span></label>
            <input type="text" id="metodo" name="metodo" placeholder="Ej. depósito, punto de encuentro" required>
          </div>
          <div class="field">
            <label for="preferencia">Preferencia de contacto <span class="obligatorio">*</span></label>
            <select id="preferencia" name="preferencia" class="input" required>
              <option value="">Seleccione...</option>
              <option>Email</option>
              <option>Teléfono</option>
              <option>WhatsApp</option>
              <option>Otro</option>
            </select>
          </div>
        </div>

        <hr class="separador">

        <div class="form-row full-width">
          <label>
            <input type="checkbox" id="acepto" name="acepto" required>
            Acepto que la información proporcionada será utilizada solo para coordinar el apoyo
          </label>
        </div>

        <div class="button-container">
          <button type="submit" class="button is-success" id="enviarBtn">Enviar datos</button>
          <a href="../home/home.html" class="button-volver" id="homeBtn">Volver</a>
        </div>
      </form>
    </div>
  </section>
  <script src="../JS/voy_apoyar.js"></script>
</body>

</html>
