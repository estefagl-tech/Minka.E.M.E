<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Voy a Apoyar!</title>
  <link rel="stylesheet" href="../minka css/voyaapoyr.css">
  <link rel="stylesheet" href="../minka js/voyaapoyar.js">

</head>
<body>
  <section class="section">

    <div class="logo">
        <div class="logo-circulo"><em>M</em></div>
        <span>MINKA</span>
    </div>

    <div class="container box">
   
      <h1 class="title has-text-centered">Voy a Apoyar!</h1>
  


      <h3 class="title is-5">Datos del Colaborador</h3>
      <div class="field">
        <label class="label">Nombre completo</label>
        <input class="input" type="text" placeholder="Ingrese su nombre">
      </div>
      <div class="field">
        <label class="label">Documento de identidad</label>
        <input class="input" type="text" placeholder="Cédula, DNI, etc.">
      </div>
      <div class="field">
        <label class="label">Teléfono de Contacto</label>
        <input class="input" type="tel" placeholder="Número de teléfono">
      </div>
      <div class="field">
        <label class="label">Correo Electrónico</label>
        <input class="input" type="email" placeholder="ejemplo@correo.com">
      </div>
      <div class="field">
        <label class="label">Dirección (Opcional)</label>
        <input class="input" type="text" placeholder="Dirección">
      </div>

   
      <h3 class="title is-5">Tipo de Apoyo</h3>
      <div class="field">
        <label class="checkbox">
          <input type="checkbox"> Donación Económica
        </label>
      </div>
      <div class="field">
        <label class="checkbox">
          <input type="checkbox"> Donación en Especie
        </label>
        <input class="input" type="text" placeholder="Ej. alimentos, ropa...">
      </div>
      <div class="field">
        <label class="checkbox">
          <input type="checkbox"> Voluntariado / Ayuda Personal
        </label>
      </div>
      <div class="field">
        <label class="checkbox">
          <input type="checkbox"> Difusión en Redes Sociales
        </label>
      </div>

      <div class="field">
        <label class="label">Monto o Disponibilidad</label>
        <input class="input" type="text" placeholder="Indique cantidad o disponibilidad">
      </div>
      <div class="field">
        <label class="label">Fecha Estimada de Apoyo</label>
        <input class="input" type="date">
      </div>


      <h3 class="title is-5">Detalles de Contacto</h3>
      <div class="field">
        <label class="label">Método de entrega/transferencia</label>
        <input class="input" type="text" placeholder="Ej. Depósito, punto de encuentro">
      </div>
      <div class="field">
        <label class="label">Preferencia de Contacto</label>
        <div class="select is-fullwidth">
          <select>
            <option>Email</option>
            <option>Teléfono</option>
            <option>WhatsApp</option>
            <option>Otro</option>
          </select>
        </div>
      </div>

      
      <div class="field">
        <label class="checkbox">
          <input type="checkbox"> Acepto que la información será utilizada solo para coordinar el apoyo.
        </label>
      </div>

   
      <div class="field has-text-centered">
        <button class="button is-success is-medium">Enviar Apoyo</button>
      </div>
    </div>
  </section>
</body>
</html>
